<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var t=localStorage.getItem("ahmadi-theme");if(!t){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);document.documentElement.classList.add("js");}catch(e){document.documentElement.classList.add("js");}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>کتاب‌خوان | دین صلح و نور احمدی</title>
  <meta name="description" content="کتاب‌خوان داخلی وب‌سایت؛ مطالعهٔ مستقیم کتاب‌ها در مرورگر، با پوستهٔ تاریک ویژهٔ PDF، انتخاب متن، جست‌وجو و ذخیرهٔ صفحهٔ مطالعه.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#151009">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/images/logo.webp" type="image/webp">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="modulepreload" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs">
</head>
<body>

  <!-- Fullscreen reader shell; the regular site chrome is hidden while open -->
  <div class="pr" id="pr">

    <header class="pr-bar">
      <a class="pr-home" href="resources.html" aria-label="بازگشت به صفحه کتاب‌ها و منابع">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>کتاب‌ها و منابع</span>
      </a>
      <span class="pr-title" id="pr-title">…</span>

      <div class="pr-tools">
        <nav class="pr-pageform" aria-label="پیمایش صفحه">
          <input id="pr-page-input" type="number" min="1" value="1" inputmode="numeric" aria-label="شماره صفحه">
          <span>از <span id="pr-page-total">…</span></span>
        </nav>
        <button class="pr-btn" id="pr-prev" type="button" aria-label="صفحهٔ قبل" title="صفحهٔ قبل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="pr-btn" id="pr-next" type="button" aria-label="صفحهٔ بعد" title="صفحهٔ بعد">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <span class="pr-sep" aria-hidden="true"></span>

        <button class="pr-btn" id="pr-zoom-out" type="button" aria-label="کوچک‌نمایی" title="کوچک‌نمایی (−)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="pr-btn" id="pr-zoom-reset" type="button" aria-label="بازنشانی بزرگ‌نمایی" title="بازنشانی (۰)">
          <span class="pr-zoom-label" id="pr-zoom-label">۱۰۰٪</span>
        </button>
        <button class="pr-btn" id="pr-zoom-in" type="button" aria-label="بزرگ‌نمایی" title="بزرگ‌نمایی (+)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>
        </button>

        <span class="pr-sep" aria-hidden="true"></span>

        <button class="pr-btn" id="pr-search-toggle" type="button" aria-label="جست‌وجو در متن" title="جست‌وجو (/)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        </button>
        <button class="pr-btn" id="pr-dark" type="button" aria-label="پوستهٔ تاریک PDF" aria-pressed="false" title="پوستهٔ تاریک PDF (D)">
          <svg class="pr-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="pr-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button class="pr-btn" id="pr-fs" type="button" aria-label="تمام‌صفحه" title="تمام‌صفحه (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </header>

    <div class="pr-search" id="pr-search" hidden>
      <input id="pr-search-input" type="search" placeholder="جست‌وجو در متن کتاب…" aria-label="جست‌وجو در متن کتاب">
      <span class="pr-search__status" id="pr-search-status" role="status" aria-live="polite"></span>
      <button class="pr-btn" id="pr-search-prev" type="button" aria-label="نتیجهٔ قبلی" title="نتیجهٔ قبلی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="pr-btn" id="pr-search-next" type="button" aria-label="نتیجهٔ بعدی" title="نتیجهٔ بعدی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="pr-btn" id="pr-search-close" type="button" aria-label="بستن جست‌وجو" title="بستن (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="pr-progress" aria-hidden="true"><span id="pr-progress-fill"></span></div>

    <main class="pr-viewport" id="pr-viewport" tabindex="0" aria-label="نمایشگر کتاب">
      <div class="pr-doc" id="pr-doc"></div>
    </main>

    <!-- Loading overlay -->
    <div class="pr-overlay" id="pr-loading">
      <div>
        <div class="pr-spinner" role="status" aria-live="polite" aria-label="در حال بارگذاری"></div>
        <h2 id="pr-loading-title">در حال آماده‌سازی کتاب…</h2>
        <p class="muted">پردازش کامل کتاب در مرورگر شما انجام می‌شود؛ هیچ فایلی جایی آپلود نمی‌گردد.</p>
      </div>
    </div>

    <!-- Error overlay -->
    <div class="pr-overlay" id="pr-error" hidden role="alert">
      <div>
        <h2>کتاب بارگذاری نشد</h2>
        <p class="muted">ممکن است اتصال اینترنت در دسترس نباشد یا فایل موقتاً در دسترس نباشد. می‌توانید دوباره تلاش کنید یا نسخهٔ دانلودی را از منبع اصلی بگیرید.</p>
        <div class="pr-error__actions" id="pr-error-actions"></div>
      </div>
    </div>

    <div class="pr-toast" id="pr-toast" role="status" aria-live="polite"></div>

  </div>

  <script type="module" src="assets/js/pdf-reader.js"></script>
</body>
</html>
