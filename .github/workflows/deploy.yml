name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety check — sources/ must never be deployed
        run: |
          if [ -d "sources" ]; then
            echo "::error::sources/ directory exists in checkout. Deployment aborted."
            exit 1
          fi

      - name: Site integrity check
        run: |
          for f in index.html assets/css/style.css assets/js/main.js assets/images/logo.webp robots.txt sitemap.xml; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
