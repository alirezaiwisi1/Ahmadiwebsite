name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety check — sources/ must never be deployed
        run: |
          if [ -d "sources" ]; then
            echo "::error::sources/ directory exists in checkout. Deployment aborted."
            exit 1
          fi

      - name: Site integrity check
        run: |
          for f in index.html assets/css/style.css assets/js/main.js \
                   assets/js/pdf-core.js assets/js/pdf-reader.js \
                   assets/pdf/index.json reader.html manifest.json sw.js \
                   assets/images/logo.webp robots.txt sitemap.xml; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done

      - name: Warn if book PDFs are not bundled
        run: |
          if [ ! -f "assets/pdf/The_Mahdis_Manifesto_Booklet_Farsi.pdf" ]; then
            echo "::warning::assets/pdf/The_Mahdis_Manifesto_Booklet_Farsi.pdf is missing."
            echo "::warning::The reader will fall back to the official download URL; add the PDF for a fully in-site experience (see assets/pdf/README.md)."
          fi

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); JSON.parse(require('fs').readFileSync('assets/pdf/index.json','utf8'));"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
